[tox]
env_list = py311, linters
no_package = true

[testenv]
base_python = python3.11
commands = pytest --junitxml=unit-tests.xml --cov=wazo_sdk --cov-report=term --cov-report=xml:coverage.xml {posargs} wazo_sdk
deps =
    -rrequirements.txt
    pytest>=9.0.0
    pytest-cov

[testenv:linters]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files

[testenv:integration]
description = bats integration tests (needs docker, bats, rsync, ssh; lsyncd optional)
passenv = HOME, XDG_*, DOCKER_*, WAZO_TEST_DOCKER_LOGS_*
allowlist_externals = bats
deps =
    -rrequirements.txt
    -e .
commands = bats {posargs:integration_tests/suite}
